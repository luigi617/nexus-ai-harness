[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-harness"
version = "0.1.0"
description = "An AI harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "luigi617" }]

dependencies = [
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    # CI installs .[dev] and importing `benchmarks` pulls in the tau-bench suite.
    "nexus-ai-harness[benchmarks]",
]
# All benchmark dependencies
benchmarks = [
    "tau-bench @ git+https://github.com/sierra-research/tau-bench",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
extend-exclude = [
    "*.md",
    "*.json"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "A", "ISC", "RET", "RUF", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are docstring-exempt.
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = [
    "benchmarks",
    "core",
    "graph",
    "harness",
    "protocols",
    "plugins",
    "services",
    "tests",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["type-abstract"]
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["boto3.*", "botocore.*", "dotenv.*"]
ignore_missing_imports = true
