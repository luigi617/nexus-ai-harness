[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-harness"
version = "0.1.0"
description = "An AI harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "luigi617" }]

dependencies = ["boto3", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "A", "ISC", "RET", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "graph",
    "harness",
    "protocols",
    "plugins",
    "services",
    "tests",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["type-abstract"]
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["boto3.*", "botocore.*", "dotenv.*"]
ignore_missing_imports = true
