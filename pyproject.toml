[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai-harness"
dynamic = ["version"]
description = "An AI harness"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "luigi617" }]

dependencies = [
    "boto3>=1.35",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/luigi617/nexus-ai-harness"
Repository = "https://github.com/luigi617/nexus-ai-harness"
Issues = "https://github.com/luigi617/nexus-ai-harness/issues"
Changelog = "https://github.com/luigi617/nexus-ai-harness/blob/main/CHANGELOG.md"

# Dependency groups (PEP 735) are not published to PyPI, so they may use
# direct git references. Install with `pip install -e . --group dev`.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    { include-group = "benchmarks" },
]
# Every benchmark dependency.
benchmarks = [
    "tau-bench @ git+https://github.com/sierra-research/tau-bench",
    "tau2 @ git+https://github.com/sierra-research/tau2-bench ; python_version >= '3.12' and python_version < '3.14'",
    "websockets>=13.0 ; python_version >= '3.12' and python_version < '3.14'",
    "swebench==5.0.2",
    "datasets>=3.0.0",
    "docker>=7.0.0",
    "pyyaml>=6.0",
]

# Version comes from the git tag (e.g. v0.2.0 -> 0.2.0).
[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
extend-exclude = [
    "*.md",
    "*.json"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "A", "ISC", "RET", "RUF", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are docstring-exempt.
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "nexus_ai_harness", "tests"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
disable_error_code = ["type-abstract"]
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["boto3.*", "botocore.*", "dotenv.*"]
ignore_missing_imports = true
