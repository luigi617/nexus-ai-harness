# Example benchmark configuration.
#
# Pass it with:  python -m benchmarks run <benchmark> --config benchmarks.example.yaml
# Only the running benchmark's section is read; the rest are ignored. Every
# value below is the suite's default, so this file changes nothing until you
# edit one — delete any field to fall back to its default. A --set flag on the
# command line overrides the matching field here.
#
# Credentials and cache locations are NOT configured here (they aren't run
# parameters): set provider API keys, Hugging Face auth, and HF_HOME in the
# environment.

bfcl:
  categories: [simple, multiple, parallel, parallel_multiple]
  version: BFCL_v4
  raw_base: null          # extra dataset URL base tried before the built-in ones
  data_dir: null          # read from a local gorilla checkout instead of fetching

tau-bench:
  env: retail             # retail | airline
  user_strategy: llm
  user_provider: openai   # any litellm provider serving user_model
  user_model: gpt-4o
  task_split: test
  max_steps: 30
  timeout_s: 300.0

tau2-bench:
  domain: airline         # see `python -m benchmarks list` errors for valid domains
  split: null             # null uses the domain's full task set
  user_model: gpt-4o
  max_steps: 30
  timeout_s: 300.0

humaneval:
  timeout_s: 15.0         # per-completion execution timeout
  isolation: auto         # auto | docker | sandbox | none (unconfined; debugging only)
  memory_limit_mb: 1024   # null for unlimited
  max_file_size_mb: 16    # null for unlimited
  max_processes: 0        # extra processes the code may spawn; null for unlimited
  docker_image: null      # null matches the host Python, e.g. python:3.12-slim

gpqa:
  subset: gpqa_diamond    # gated dataset; authenticate with `huggingface-cli login`

gaia:
  subset: 2023_all        # gated dataset; authenticate with `huggingface-cli login`
  split: validation
  max_steps: 30
  timeout_s: 600.0

swe-bench:
  dataset: SWE-bench/SWE-bench_Verified   # or SWE-bench/SWE-bench_Lite
  max_steps: 50
  timeout_s: 1800.0
  allow_network: true     # agent's host-side shell; grading always runs in Docker
