name: Setup
description: Set up Python (with pip cache) and install the project with dev extras.

inputs:
  python-version:
    description: Python version to install.
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - run: pip install -e ".[dev]"
      shell: bash
