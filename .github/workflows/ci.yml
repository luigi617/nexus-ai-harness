name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: pytest

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pytest

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pytest

  min-version:
    name: Min Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system --resolution lowest-direct -e . --group dev
      - run: pytest

  sandbox-bwrap:
    name: Sandbox (bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04+ AppArmor blocks unprivileged user namespaces, which bwrap needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Run the whole suite under real bwrap; the bwrap tests fail, not skip, here.
      - run: pytest
        env:
          NEXUS_TEST_REQUIRE_BWRAP: "1"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: >-
          pytest --cov=src/nexus_ai_harness --cov-report=term-missing
          --cov-report=xml --cov-fail-under=95
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  concurrency-repeat:
    name: Concurrency repeat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Runs each timing-sensitive test many times with reruns disabled, so a
      # race that only shows up once in a while can't hide behind a retry.
      - run: >-
          pytest -p no:rerunfailures --count=10
          tests/test_approver.py::test_console_serializes_concurrent_prompts
          tests/test_approver.py::test_console_concurrent_same_tool_prompts_once
          tests/test_agentic_loop.py::test_parallel_tool_calls_run_concurrently
          tests/test_memory.py::test_stores_on_one_directory_share_the_in_process_lock
