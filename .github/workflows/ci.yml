name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: pytest

  min-version:
    name: Min Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: uv pip install --system --resolution lowest-direct -e . --group dev
      - run: pytest

  sandbox-bwrap:
    name: Sandbox (bubblewrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04+ AppArmor blocks unprivileged user namespaces, which bwrap needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Run the whole suite under real bwrap; the bwrap tests fail, not skip, here.
      - run: pytest
        env:
          NEXUS_TEST_REQUIRE_BWRAP: "1"
